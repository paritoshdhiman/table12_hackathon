[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "MarketAnalystAgent"
version = "0.1.0"
description = "Market Analyst Agent (Anthropic SDK) — deployed on Amazon Bedrock AgentCore"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bedrock-agentcore >= 1.9.1",
    "anthropic[bedrock] >= 0.49.0",
    "pandas >= 2.2",
    "boto3 >= 1.34",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
